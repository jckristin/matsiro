name: Deploy to Raspberry Pi 4

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # L'action checkout télécharge automatiquement le code sur le Pi
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement de l'application Symfony
        run: |
          # Copie des fichiers récupérés vers le dossier de destination
          sudo cp -r . /var/www/matsiro/
          cd /var/www/matsiro
          sudo chown -R intelloctet:intelloctet /var/www/matsiro

          # Installation des dépendances et nettoyage du cache
          composer install --no-dev --optimize-autoloader
          php bin/console cache:clear --env=prod